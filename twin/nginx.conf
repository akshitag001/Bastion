# Loopback-only proxy into the offline Bastion container (see docker-compose.yml).
server {
    listen 80;
    client_max_body_size 16k;            # scans are <= 2,048 chars

    location / {
        proxy_pass http://bastion:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;             # stream the Llama explanation (SSE) token by token
        proxy_cache off;
        proxy_read_timeout 900s;         # emulated Llama can take minutes
    }
}
