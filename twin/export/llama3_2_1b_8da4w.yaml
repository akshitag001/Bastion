# ExecuTorch 1.6.0 LlmConfig for Bastion's explainer model.
# Keys verified against extension/llm/export/config/llm_config.py @ v1.6.0 and
# examples/models/llama/config/llama_q8da4w.yaml @ v1.6.0.
# Paths are inside the export container (repo mounted at /work).
base:
  model_class: llama3_2
  checkpoint: /work/models/llama/hf/original/consolidated.00.pth
  params: /work/models/llama/hf/original/params.json
  # Llama 3 BOS / EOS (<|eot_id|>, <|end_of_text|>), as in the upstream q8da4w config
  metadata: '{"get_bos_id":128000, "get_eos_ids":[128009, 128001]}'

model:
  use_kv_cache: True
  use_sdpa_with_kv_cache: True
  dtype_override: fp32

export:
  # Our prompt (system + evidence) is ~300-400 tokens; explanation is capped at ~160 new tokens.
  max_seq_length: 768
  max_context_length: 768
  output_dir: /work/models/llama
  output_name: llama3_2_1b_8da4w.pte

quantization:
  qmode: 8da4w          # int8 dynamic activations, int4 grouped weights
  group_size: 128
  embedding_quantize: 4,32

backend:
  xnnpack:
    enabled: True
    extended_ops: True
